# Seed agents for `spur init`. Same schema as .spur/config.toml.
#
# `spur init` parses this, scans $PATH for each `command`, and registers
# matching entries into the in-memory AgentRegistry. The CLI then writes
# that registry to .spur/config.toml as the user's starting config.
#
# IMPORTANT: `spur init` OVERWRITES .spur/config.toml. If you've
# customized your config, edit it by hand rather than re-running init.
#
# To add a new seed agent: append an [[agents.entries]] block below. No
# Rust changes are required. See docs/spur/agent-onboarding-cookbook.md.

# ── kiro ──────────────────────────────────────────────────────────
[[agents.entries]]
name = "kiro"
command = "kiro-cli"
args = ["acp"]
transport = "acp"
kind = "kiro"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "kiro"

[agents.entries.commands]
dispatch = "prompt_text"

[[agents.entries.commands.ingest]]
method = "_kiro.dev/commands/available"
parser = "json_path_list"
path = "commands"
item_schema = "acp_available_command"

[agents.entries.permissions]
args = ["--trust-all-tools"]

# ── claude-code ───────────────────────────────────────────────────
# Pin deliberately — @latest silently pulls breaking adapter changes.
# Bumped 0.33.1 → 0.54.1 after live probe 2026-07-13 (configOptions model +
# effort/thought_level, agent profile option, set_mode; session/set_model
# unsupported — use set_config_option). Re-probe on every pin bump:
#   python3 scripts/probe_acp_capabilities.py \
#     --command npx --args "--yes @agentclientprotocol/claude-agent-acp@<ver>" \
#     --label claude-code --probe-vendor-rpc --always-approve --try-set-model
[[agents.entries]]
name = "claude-code"
command = "npx"
args = ["--yes", "@agentclientprotocol/claude-agent-acp@0.54.1"]
transport = "acp"
kind = "claude-code-acp"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "claude"

[agents.entries.commands]
dispatch = "prompt_text"

[agents.entries.permissions]
session_mode = "bypassPermissions"

# ── codex-bin (via agentclientprotocol/codex-acp, direct binary) ──────
# Executable that bridges the OpenAI Codex runtime with ACP over stdio.
# Install: npm install -g @agentclientprotocol/codex-acp@1.9.0
# Or use the version-pinned npx entry below.
[[agents.entries]]
name = "codex-bin"
command = "codex-acp"
args = []
transport = "acp"
kind = "codex-acp"
role = "both"
cost_tier = "low"

[agents.entries.display]
handle = "codex"

[agents.entries.commands]
dispatch = "prompt_text"

# ── codex (npx wrapper, version-pinned) ──────────────────────
# Same agent as above but via npx — no pre-installed binary needed.
# Pinned version is critical: @latest would silently pull breaking
# changes mid-session. Bump deliberately and retest after each bump.
[[agents.entries]]
name = "codex"
command = "npx"
args = ["--yes", "@agentclientprotocol/codex-acp@1.9.0"]
transport = "acp"
kind = "codex-acp"
role = "both"
cost_tier = "low"

[agents.entries.display]
handle = "codex"

[agents.entries.commands]
dispatch = "prompt_text"

[[agents.entries.commands.static]]
name = "review"
description = "Review current changes and find issues"
hint = "[optional instructions]"

[[agents.entries.commands.static]]
name = "review-branch"
description = "Review code changes against a specific branch"
hint = "[branch name]"

[[agents.entries.commands.static]]
name = "review-commit"
description = "Review code changes introduced by a commit"
hint = "[commit sha]"

[[agents.entries.commands.static]]
name = "init"
description = "Create an AGENTS.md with repository guidance"

[[agents.entries.commands.static]]
name = "compact"
description = "Summarize conversation to prevent hitting context limit"

[[agents.entries.commands.static]]
name = "undo"
description = "Undo Codex's most recent turn"

[[agents.entries.commands.static]]
name = "logout"
description = "Logout of Codex"

# ── gemini ────────────────────────────────────────────────────────
[[agents.entries]]
name = "gemini"
command = "gemini"
args = ["--acp", "-y", "-m", "deep-thinker"]
transport = "acp"
kind = "gemini"
role = "both"
cost_tier = "low"

[agents.entries.display]
handle = "gemini"

[agents.entries.commands]
dispatch = "prompt_text"

# ── opencode ──────────────────────────────────────────────────────
[[agents.entries]]
name = "opencode"
command = "opencode"
args = ["acp"]
transport = "acp"
kind = "open-code"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "opencode"

[agents.entries.commands]
dispatch = "prompt_text"


# ── kimi ──────────────────────────────────────────────────────────
# `-y --afk` must precede `acp`. `-y` covers file tools but not shell exec (L2 perm_tx=None → auto_approve handles residual). `--afk` is required on kimi 1.40.0+ — `-y` alone silences agent_message_chunk in ACP mode. R3 warn is intentional.
[[agents.entries]]
name = "kimi"
command = "kimi"
args = ["-y", "--afk", "acp"]
transport = "acp"
kind = "kimi"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "kimi"

[agents.entries.commands]
dispatch = "prompt_text"

[agents.entries.permissions]
skip = true

# ── grok ──────────────────────────────────────────────────────────
# xAI Grok Build CLI. `--no-auto-update` is global; `--always-approve` must be
# scoped to the `agent` subcommand before `stdio`, which speaks ACP over stdio.
# Grok 1.0.34 advertises no ACP session modes, so
# `session_mode = "always-approve"` cannot activate its permission bypass;
# launch with `--always-approve` instead. Keep Spur's interactive permission
# channel enabled as a fail-closed fallback. Pin auto_update=false in
# ~/.grok/config.toml for reproducibility.
#
# ACP model / effort surface (SPUR synthesizer):
#   SPUR only synthesizes mid-session `/model` and `/effort` from
#   session/new configOptions (category model / thought_level). Grok's
#   interactive TUI has local `/model` and `/session-info` builtins, but
#   those are not automatically advertised over ACP. Until a live probe
#   shows configOptions on `grok agent stdio`, expect no SPUR `/model`
#   picker — pin spawn-time model instead, e.g. insert `--model grok-build`
#   before `stdio`. Probe: `python3 scripts/probe_grok_acp.py`.
#   Spec: docs/superpowers/specs/2026-07-13-grok-acp-capability-probe-results.md
# Do NOT add static [[commands.static]] name="model" here unless the agent
# is confirmed to honor `/model …` as prompt text; a fake static would not
# call session/set_config_option and misleads users.
[[agents.entries]]
name = "grok"
command = "grok"
args = ["--no-auto-update", "agent", "--always-approve", "stdio"]
transport = "acp"
kind = "grok"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "grok"

[agents.entries.commands]
dispatch = "prompt_text"

# ── goose ────────────────────────────────────────────────────────
# Block's goose CLI. `goose acp` speaks ACP natively over stdio.
# Live probe 2026-09-29 (goose 1.52.0):
#   python3 scripts/probe_acp_capabilities.py --command goose --args acp \
#     --label goose
#   initialize agentInfo name=goose version=1.52.0
#   session/new advertises configOptions provider/mode/model/thinking_effort
#     → SPUR synthesizes /model and /effort. Do NOT add static
#     [[commands.static]] model/effort entries — they would not call
#     session/set_config_option.
#   available_commands_update streams dynamic commands (compact, clear,
#     skills, doctor, …) — no static commands needed.
#   Modes advertised: auto / approve / smart_approve / chat. `auto`
#     ("automatically approve tool calls") is declared below as the bypass
#     session_mode; it only activates when the user opts in with
#     [permissions] skip = true. Spur's interactive permission channel
#     remains the fail-open default.
[[agents.entries]]
name = "goose"
command = "goose"
args = ["acp"]
transport = "acp"
kind = "generic"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "goose"

[agents.entries.commands]
dispatch = "prompt_text"

[agents.entries.permissions]
session_mode = "auto"

# ── pi ────────────────────────────────────────────────────────────
# Pi coding agent via svkozak/pi-acp. The adapter speaks ACP over stdio
# and spawns `pi --mode rpc`, so both binaries must be on $PATH.
# Install (solver-verified 2026-09-17, sol_85fe994647ef4427):
#   npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
#   npm install -g pi-acp@0.0.33
# pi-acp requires pi >= 0.80.4 and Node 20+ (docs recommend Node 22).
#
# Live probe 2026-09-17 (`scripts/probe_acp_capabilities.py --command pi-acp`):
#   initialize agentInfo name=pi-acp version=0.0.33
#   loadSession=true; promptCapabilities.image=true; embeddedContext=false
#   session/new advertises configOptions id=model (select) and
#   id=thought_level (select) plus ACP models/modes catalogs — SPUR
#   synthesizes /model and /effort. Dynamic available_commands include
#   compact/autocompact/export/session/name/steering/follow-up/changelog.
#   Do NOT add static [[commands.static]] name="model"; that would not
#   call session/set_config_option.
# Z.AI Coding Plan: reuse OpenCode `~/.local/share/opencode/auth.json`
# provider `zai-coding-plan` into `~/.pi/agent/auth.json` key `zai`
# (type=api_key). Optional: defaultProvider=zai, defaultModel=glm-4.7.
[[agents.entries]]
name = "pi"
command = "pi-acp"
args = []
transport = "acp"
kind = "pi"
role = "both"
cost_tier = "medium"

[agents.entries.display]
handle = "pi"

[agents.entries.commands]
dispatch = "prompt_text"
