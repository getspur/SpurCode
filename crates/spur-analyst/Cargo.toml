[package]
name = "spur-analyst"
description = "SPUR DuckDB analyst integration tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/getspur/spur-releases"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
arrow-array = { workspace = true }
async-trait = { workspace = true }
duckdb = { workspace = true, features = ["bundled"] }
futures = { workspace = true }
globset = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
spur-graph = { workspace = true }
spur-embedding = { path = "../spur-embedding", optional = true }
spur-mcp = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[features]
default = ["embed"]
embed = ["spur-graph/embed", "dep:spur-embedding"]

[dev-dependencies]
spur-cli = { path = "../spur-cli" }
spur-graph = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
