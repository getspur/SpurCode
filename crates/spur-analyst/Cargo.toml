[package]
name = "spur-analyst"
description = "SPUR DuckDB analyst integration tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/getspur/spur-releases"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
arrow-array = { workspace = true }
async-trait = { workspace = true }
duckdb = { workspace = true }
# 5.8.0 includes NomicEmbedTextV15 and JinaEmbeddingsV2BaseCode. CodeRankEmbed
# is loaded centrally by spur-graph. Newer 5.x releases pull ORT
# rc.11/rc.12 binaries that require newer Linux runtime symbols on the build VM.
fastembed = { version = "=5.8.0", default-features = false, optional = true }
futures = { workspace = true }
globset = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
spur-graph = { workspace = true }
spur-mcp = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[features]
default = ["embed", "duckdb-bundled"]
duckdb-bundled = ["duckdb/bundled"]
embed = [
    "dep:fastembed",
    "fastembed/hf-hub-native-tls",
    "fastembed/ort-download-binaries",
    "spur-graph/embed",
]

[dev-dependencies]
spur-cli = { path = "../spur-cli", default-features = false }
tempfile = "3"

[lints]
workspace = true
