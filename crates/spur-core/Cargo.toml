[package]
name = "spur-core"
description = "Orchestrator engine — drives the brain-worker pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["embed"]
embed = ["spur-analyst/embed", "spur-graph/embed"]
test-support = []
test-helpers = []
fault-injection = []
# Enables cfg(madsim)-only reconciler simulation tests. Normal builds and
# default cargo test runs do not compile the madsim harness.
madsim-sim = ["test-support"]
# Opt-in kill switch: brain sessions do not inject the notebook stdio MCP
# (`SpurLab` / `spur-notebook --mcp-proxy`). Use when the notebook GUI spawn
# path breaks job control (SIGTTIN / `suspended (tty input) spur tui`).
# Build: `cargo build -p spur-cli --features disable-notebook-mcp`
# (or `scripts/spur-cargo build -p spur-cli --features disable-notebook-mcp`).
disable-notebook-mcp = []

[dependencies]
axum = { workspace = true }
base64ct = { version = "1", features = ["alloc"] }
dashmap = "6"
fs4 = "0.13"
hmac = "0.12"
libc = "0.2"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
secrecy = "0.10"
rmcp = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
spur-acp = { workspace = true }
spur-context-auth = { workspace = true }
spur-analyst = { workspace = true, default-features = false }
spur-blob-store = { workspace = true }
spur-graph = { workspace = true, default-features = false }
spur-jev = { workspace = true }
spur-mcp = { workspace = true }
spur-pm = { workspace = true }
spur-solver = { workspace = true }
spur-worktree = { workspace = true }
spur-cost = { workspace = true }
spur-telemetry = { path = "../spur-telemetry" }
spur-license = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
md5 = "0.7"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# `start_paused = true` on `#[tokio::test]` + `tokio::time::advance` require
# the `test-util` feature.
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
duckdb = { workspace = true }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tracing-subscriber = { workspace = true }
spur-blob-store = { workspace = true, features = ["test-support"] }
spur-graph = { workspace = true, default-features = false, features = ["embed", "test-support"] }
spur-license = { workspace = true, features = ["test-support"] }
spur-core = { path = ".", features = ["test-support"] }
proptest = "1"
proptest-state-machine = "0.8"
fs4 = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(madsim)'.dev-dependencies]
madsim = "0.2"
madsim-tokio = { version = "0.2", features = ["full", "test-util"] }
spur-test-madsim = { path = "../spur-test-madsim" }

[[test]]
name = "madsim_reconciler"
path = "tests/madsim_reconciler/main.rs"
required-features = ["madsim-sim"]

[[test]]
name = "shutdown_mcp_server_bounded"
path = "tests/shutdown_mcp_server_bounded.rs"
required-features = ["test-support"]

[[test]]
name = "review_loopback_e2e"
path = "tests/review_loopback_e2e.rs"
required-features = ["test-support"]

[[test]]
name = "review_gate_integration"
path = "tests/review_gate_integration.rs"
required-features = ["test-support"]

[[test]]
name = "retry_reflexion"
path = "tests/retry_reflexion.rs"
required-features = ["test-support"]

[[test]]
name = "agent_profile_delegation_e2e"
path = "tests/agent_profile_delegation_e2e.rs"
required-features = ["test-support"]

[[bench]]
name = "event_replay"
harness = false

[lints]
workspace = true
