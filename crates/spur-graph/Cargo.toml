[package]
name = "spur-graph"
description = "Code graph substrate and typed fact model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[package.metadata.dist]
dist = false

[features]
default = ["embed"]
embed = ["dep:fastembed", "dep:hf-hub", "dep:ort"]
perf-gates = ["test-support"]
test-support = []

[lib]
bench = false

[dependencies]
anyhow = { workspace = true }
arc-swap = "1"
async-trait = { workspace = true }
blake3 = "1"
chrono = { workspace = true }
clap = { workspace = true }
fs2 = "0.4"
futures = { workspace = true }
gix = { version = "0.77", default-features = false, features = ["max-performance-safe", "revision", "blob-diff"] }
globset = "0.4"
ignore = "0.4.25"
indicatif = "0.18"
notify = "=8.2.0"
nltk-porter = "0.1.0"
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = "58"
base64 = "0.22"
# 5.8.0 includes NomicEmbedTextV15 and JinaEmbeddingsV2BaseCode. CodeRankEmbed
# uses the user-defined ONNX path. Newer 5.x releases pull ORT
# rc.11/rc.12 binaries that require newer Linux runtime symbols on the build VM.
fastembed = { version = "=5.8.0", default-features = false, features = ["hf-hub-native-tls"], optional = true }
hf-hub = { version = "=0.4.3", default-features = false, features = ["native-tls", "ureq"], optional = true }
parquet = { workspace = true, features = ["arrow", "async"] }
petgraph = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
spur-mcp = { workspace = true }
spur-solver = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25"
# One grammar covers both .tf and .hcl (shared-variant precedent: Javascript/Tsx on LANGUAGE_TSX).
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7.2"
tree-sitter-mermaid = { path = "../tree-sitter-mermaid" }
tracing = { workspace = true }
watchman_client = "=0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
fastembed = { version = "=5.8.0", default-features = false, features = ["ort-load-dynamic"], optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "managed-environment"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fastembed = { version = "=5.8.0", default-features = false, features = ["ort-download-binaries"], optional = true }

[build-dependencies]
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
duckdb = { workspace = true, features = ["bundled"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "owner-test-hooks"] }

[dev-dependencies]
bytes = "1"
criterion = "0.5"
insta = { workspace = true }
libc = "0.2"
parquet = { workspace = true, features = ["arrow"] }
pretty_assertions = "1"
tempfile = "3"
tracing-subscriber = { workspace = true }

[[bench]]
name = "incremental"
harness = false

[[bench]]
name = "parquet"
harness = false

[[bench]]
name = "overlay"
harness = false

[[bin]]
name = "capture-baselines"
path = "benches/capture_baselines.rs"

# Narrow quarantine: keep workspace safety lints active for spur-graph while
# suppressing the measured noisy backlog families. `exit`,
# `undocumented_unsafe_blocks`, `dbg_macro`, `todo`, `unimplemented`,
# `mem_forget`, `transmute_*`, and async-holding lints remain active.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

arc_with_non_send_sync = "deny"
await_holding_invalid_type = "deny"
await_holding_lock = "warn"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
exit = "deny"
future_not_send = "warn"
if_let_mutex = "deny"
infinite_loop = "deny"
mem_forget = "warn"
mutex_integer = "deny"
rc_mutex = "deny"
readonly_write_lock = "deny"
suspicious_command_arg_space = "deny"
todo = "deny"
transmute_ptr_to_ptr = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "warn"
unimplemented = "deny"
useless_transmute = "deny"

allow_attributes = "allow"
clone_on_ref_ptr = "allow"
field_reassign_with_default = "allow"
fn_params_excessive_bools = "allow"
format_push_string = "allow"
ignore_without_reason = "allow"
iter_on_single_items = "allow"
iter_over_hash_type = "allow"
manual_let_else = "allow"
map_err_ignore = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_assert_message = "allow"
needless_continue = "allow"
ref_option = "allow"
semicolon_if_nothing_returned = "allow"
unnecessary_wraps = "allow"
useless_let_if_seq = "allow"
