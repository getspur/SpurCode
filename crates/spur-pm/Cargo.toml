[package]
name = "spur-pm"
description = "PM tool adapters — GitHub Issues via gh CLI (Phase 1), Linear and Plane (Phase 3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-helpers = []

[dependencies]
anyhow = { workspace = true }
fs2 = "0.4"
libc = "0.2"
rusqlite = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
sysinfo = "0.30.13"
beads_rust = { git = "https://github.com/getspur/beads_rust", rev = "47b3b39a54b04c7d51d735c032c82e891c2a0db8", default-features = false }
petgraph = { workspace = true }
regex = { workspace = true }
semver = "1"
spur-mcp = { workspace = true }
tempfile = "3"
# GitHub adapter (Phase 1 ingest). Pinned exact per docs/architecture/spur-pm-github-ingest.md.
octocrab = { version = "=0.50.0", features = ["rustls-webpki-tokio"] }
http = "1"
secrecy = "=0.10.3"
# rustls provider for octocrab when the GitHub adapter is used outside spur-cli.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
filetime = "0.2"
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(madsim)'.dev-dependencies]
madsim = "0.2"
madsim-tokio = { version = "0.2", features = ["full", "test-util"] }
spur-test-madsim = { path = "../spur-test-madsim" }

[[test]]
name = "beads_durability_madsim"
path = "tests/beads_durability_madsim.rs"
required-features = ["test-helpers"]

[lints]
workspace = true
