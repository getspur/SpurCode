[package]
name = "spur-cli"
description = "SPUR CLI binary — entry point for all commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/getspur/spur-releases"
include = ["src/**", "tests/**", "build.rs", "assets/skills/**"]

[[bin]]
name = "spur"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[package.metadata.dist]
dist = true

[features]
default = ["embed", "tui-default", "interactive-default", "duckdb-bundled"]
duckdb-bundled = ["spur-core/duckdb-bundled", "spur-context/duckdb-bundled"]
duckdb = ["spur-context/duckdb"]
embed = [
    "spur-analyst/embed",
    "spur-core/embed",
    "spur-graph/embed",
    "spur-interactive/core-embed",
    "spur-tui/core-embed",
    "spur-tui/graph-embed",
]
interactive-default = ["spur-interactive/default"]
test-seam = []
worker-no-embed = []
tui-default = ["spur-tui/default"]
# Telegram bot frontend. Off by default: the `spur bot` command, the
# `spur init` Telegram prompt, and the `spur-bot` crate are all compiled
# out unless this feature is enabled. Re-enable with
# `cargo build --features telegram-bot`.
telegram-bot = ["dep:spur-bot"]
# Compile out brain-session notebook MCP injection (see spur-core).
# `scripts/spur-cargo build -p spur-cli --features disable-notebook-mcp`
disable-notebook-mcp = ["spur-core/disable-notebook-mcp"]

[dependencies]
spur-acp = { workspace = true }
spur-blob-store = { workspace = true }
spur-analyst = { workspace = true, default-features = false }
spur-core = { workspace = true, default-features = false }
spur-cost = { workspace = true }
spur-context = { workspace = true }
spur-context-auth = { path = "../spur-context-auth" }
spur-graph = { workspace = true, default-features = false }
spur-mcp = { workspace = true }
spur-solver = { workspace = true }
spur-pm = { workspace = true }
spur-license = { workspace = true }
spur-tui = { workspace = true, default-features = false }
spur-interactive = { workspace = true, default-features = false }
spur-bot = { workspace = true, optional = true }
spur-worktree = { workspace = true }
spur-telemetry = { path = "../spur-telemetry" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
secrecy = "0.10"
url = "2"
semver = { workspace = true }
duckdb = { workspace = true }
file-rotate = "0.8"
indicatif = "0.18"
# rustls provider for octocrab's TLS handshake — see main.rs for the
# install_default() call. `ring` keeps us off the heavier `aws-lc-rs`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# nix does not compile for windows targets; the sole use (NOFILE rlimit
# raise in main.rs) is already #[cfg(unix)]-gated with a no-op stub.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["resource"] }

[dev-dependencies]
tempfile = "3"
spur-license = { workspace = true, features = ["test-support"] }
spur-pm = { workspace = true, features = ["test-helpers"] }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
assert_cmd = "2"
uuid = { workspace = true }
wiremock = "0.6"

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
