[workspace]
resolver = "2"
members = [
    "crates/spur-acp",
    "crates/spur-blob-store",
    "crates/spur-mcp",
    "crates/spur-jev",
    "crates/spur-solver",
    "crates/spur-core",
    "crates/spur-pm",
    "crates/spur-worktree",
    "crates/spur-cost",
    "crates/spur-license",
    "crates/spur-license-admin",
    "crates/spur-tui",
    "crates/spur-interactive",
    "crates/spur-bot",
    "crates/spur-cli",
    "crates/spur-analyst",
    "crates/spur-telemetry",
    "crates/spur-test-madsim",
    "crates/spur-context",
    "crates/spur-context-source",
    "crates/spur-context-fetcher",
    "crates/spur-context-auth",
    "crates/spur-code-eval",
    "crates/spur-graph",
    "crates/spur-utilities/facade",
    "crates/spur-utilities/mentions",
    "crates/spur-utilities/commands",
    "crates/tree-sitter-mermaid",
    "xtask",
]
# spur-context-service is excluded — it uses duckdb v1.5.4 (DuckLake 1.0)
# independently from the workspace's duckdb v1.4.4 (needed by spur-analyst
# for DuckPGQ). Build it separately:
#   cargo build -p spur-context-service --features worker --release
exclude = [
    "crates/spur-context-service",
]
[workspace.package]
version = "1.24.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
schemars = "0.8"
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
parquet = { version = "58", default-features = false, features = ["zstd"] }
arrow-array = "58"
arrow-buffer = "58"
arrow-ipc = "58"
arrow-schema = "58"
memmap2 = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ignore = "0.4"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "1.4", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }

# Database
rusqlite = { version = "0.39", features = ["bundled"] }
# `bundled` makes duckdb-rs compile libduckdb from source and link it
# statically. This drops the runtime `libduckdb.dylib` dependency and lets
# `cargo install --path crates/spur-cli` work without any system package.
# Cost: a cold release build of duckdb ~4 minutes on macOS.
# Version pinned here; `duckdb-bundled` selects source builds in consumers.
# Prebuilt builds disable defaults and provide DUCKDB_LIB_DIR/DUCKDB_STATIC.
# `vtab` remains pinned at the workspace baseline
# so every remaining workspace consumer resolves duckdb to one feature set.
#
# Pinned EXACTLY to =1.4.4 (the workspace standard): this is the newest DuckDB
# engine where the ducklake (core repo) AND duckpgq + onager (community repo)
# extensions all coexist. Do NOT relax to a caret (`1.4.4`) — that resolves to
# 1.4.5, where duckpgq/onager community builds 404. See
# docs/spikes/duckdb-145-ducklake-duckpgq-probe/VERDICT.md.
duckdb = { version = "=1.4.4", features = ["vtab"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "2"
thiserror = "2"
anyhow = "1"
directories = "5"
regex = "1"
semver = "1"
sha2 = "0.10"
similar = "2.7"
base64 = "0.22"
url = "2"
proptest = "1"
insta = "=1.41.1"
petgraph = { version = "0.6", default-features = false, features = ["stable_graph"] }

# ACP SDK
agent-client-protocol = { version = "1.0", features = ["unstable_elicitation", "unstable_end_turn_token_usage"] }
licenseseat = "=0.5.3"

# Workspace crates
spur-acp = { path = "crates/spur-acp" }
spur-commands = { path = "crates/spur-utilities/commands" }
spur-blob-store = { path = "crates/spur-blob-store" }
spur-mcp = { path = "crates/spur-mcp" }
spur-jev = { path = "crates/spur-jev" }
spur-solver = { path = "crates/spur-solver" }
spur-core = { path = "crates/spur-core", default-features = false }
spur-pm = { path = "crates/spur-pm" }
spur-worktree = { path = "crates/spur-worktree" }
spur-cost = { path = "crates/spur-cost" }
spur-license = { path = "crates/spur-license" }
spur-tui = { path = "crates/spur-tui", default-features = false }
spur-interactive = { path = "crates/spur-interactive", default-features = false }
spur-bot = { path = "crates/spur-bot" }
spur-context = { path = "crates/spur-context", default-features = false }
spur-context-source = { path = "crates/spur-context-source" }
spur-context-fetcher = { path = "crates/spur-context-fetcher" }
spur-context-service = { path = "crates/spur-context-service" }
spur-graph = { path = "crates/spur-graph", default-features = false }
spur-utilities = { path = "crates/spur-utilities/facade" }
spur-mentions = { path = "crates/spur-utilities/mentions" }
spur-analyst = { path = "crates/spur-analyst", default-features = false }


# ---------------------------------------------------------------------------
# Workspace lints
# ---------------------------------------------------------------------------
# Structure adapted from emilk/egui's Cargo.toml. Each member crate opts in
# with `[lints] workspace = true`.
#
# Levels are intentionally `warn` for the initial rollout so the existing
# tree builds. Once `cargo clippy --workspace --all-targets` is clean we
# flip the noisy groups (`all`, `unwrap_used`, `print_stdout`, …) to `deny`
# so regressions cannot land. See: scripts/spur-cargo.
[workspace.lints.rust]
unsafe_code = "deny"

elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

trivial_casts = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

allow_attributes = "warn"
arc_with_non_send_sync = "deny"
as_ptr_cast_mut = "warn"
await_holding_invalid_type = "deny"
await_holding_lock = "warn"
await_holding_refcell_ref = "deny"
bool_to_int_with_if = "warn"
branches_sharing_code = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
coerce_container_to_any = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_names = "warn"
disallowed_script_idents = "warn"
disallowed_types = "warn"
doc_broken_link = "warn"
doc_comment_double_space_linebreaks = "warn"
doc_include_without_cfg = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
elidable_lifetime_names = "warn"
empty_enums = "warn"
empty_enum_variants_with_brackets = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "deny"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
from_iter_instead_of_collect = "warn"
future_not_send = "warn"
get_unwrap = "warn"
if_let_mutex = "deny"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
implied_bounds_in_impls = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infinite_loop = "deny"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "warn"
ip_constant = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
iter_without_into_iter = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_include_file = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_enforced_import_renames = "warn"
# missing_errors_doc / needless_pass_by_value / too_long_first_doc_paragraph
# / unwrap_used / print_{stdout,stderr}: downgraded to allow because spur's
# CLI tools and tests legitimately use these patterns. See `allow` list
# below for the full softened set.
# missing_errors_doc moved to the `allow` block below.
missing_fields_in_debug = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
mut_mut = "warn"
mutex_integer = "deny"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_string_hashes = "warn"
negative_feature_names = "warn"
non_std_lazy_statics = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option_option = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
pub_underscore_fields = "warn"
pub_without_shorthand = "warn"
rc_mutex = "deny"
readonly_write_lock = "deny"
redundant_type_annotations = "warn"
ref_as_ptr = "warn"
ref_option = "warn"
ref_option_ref = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_functions_in_if_condition = "warn"
self_only_used_in_recursion = "warn"
semicolon_if_nothing_returned = "warn"
set_contains_or_insert = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
single_option_map = "warn"
str_split_at_newline = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_command_arg_space = "deny"
suspicious_xor_used_as_pow = "warn"
todo = "deny"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_ptr_to_ptr = "deny"
tuple_array_conversions = "warn"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "warn"
unimplemented = "deny"
uninhabited_references = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_literal_bound = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_self = "warn"
unused_trait_names = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
useless_transmute = "deny"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"
zero_sized_map_values = "warn"

cast_possible_wrap = "allow"
comparison_chain = "allow"
should_panic_without_expect = "allow"
too_many_lines = "allow"

# Softened: spur is a CLI + test-heavy workspace; these patterns are
# intentional and the cost of denying them outweighs the benefit. The
# bug-catching lints (dbg_macro, todo, unimplemented, mem_forget,
# await_holding_lock, …) remain at warn.
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
print_stderr = "allow"
print_stdout = "allow"
too_long_first_doc_paragraph = "allow"
unwrap_used = "allow"

assigning_clones = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
manual_range_contains = "allow"
map_unwrap_or = "allow"
self_named_module_files = "allow"
significant_drop_tightening = "allow"
wildcard_imports = "allow"


# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Profiling profile: release optimizations with full debug symbols
# Use with: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = false
codegen-units = 1
lto = "thin"

# Dev/test compile-time tuning. Full debuginfo (debug=2, the default) is one of
# the slowest parts of dev/test builds and linking. line-tables-only keeps panic
# backtraces and accurate profiling stack attribution — and `force-frame-pointers`
# (.cargo/config.toml) is an orthogonal rustflag that stays on — while cutting
# dev/test compile+link time materially. The release/dist/profiling profiles are
# untouched: `profiling` sets debug=true explicitly for full local-variable
# debugging. Need a full-debuginfo dev build? `RUSTFLAGS="-C debuginfo=2" cargo build`.
# `[profile.test]` inherits these via `dev`.
[profile.dev]
debug = "line-tables-only"

# Build scripts and proc-macros are compiled once but executed many times; this
# workspace is macro/codegen-heavy (tauri, prost, serde, tree-sitter), so paying
# to optimize them pays back in faster macro expansion / codegen execution.
[profile.dev.build-override]
opt-level = 3
