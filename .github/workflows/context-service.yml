name: Context Service

on:
  pull_request:
    paths:
      - ".github/workflows/context-service.yml"
      - "crates/spur-context-service/**"
      - "infra/spur-context-service/**"
      - "tests/scripts/test_spur_context_service_deploy.py"
      - "scripts/cloud-build/**"
      - "scripts/spur-cargo"
  push:
    branches: [main]
    paths:
      - ".github/workflows/context-service.yml"
      - "crates/spur-context-service/**"
      - "infra/spur-context-service/**"
      - "tests/scripts/test_spur_context_service_deploy.py"
      - "scripts/cloud-build/**"
      - "scripts/spur-cargo"
  workflow_dispatch:
    inputs:
      build_aws_artifacts:
        description: "Build/push staging ECR worker images and build the serving Lambda zip"
        required: true
        type: boolean
        default: false
      run_staging_smoke:
        description: "Run the real-AWS staging medallion smoke"
        required: true
        type: boolean
        default: false

# PR runs supersede each other; main-push runs queue instead of cancelling so
# a release rollout is never killed mid-flight (release-dist.yml lesson).
concurrency:
  group: context-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AWS_REGION: ${{ vars.CONTEXT_SERVICE_AWS_REGION || 'ap-southeast-5' }}
  AWS_DEFAULT_REGION: ${{ vars.CONTEXT_SERVICE_AWS_REGION || 'ap-southeast-5' }}

jobs:
  crate-serving-features:
    name: crate test deployable serving features
    runs-on: ubuntu-24.04
    env:
      SPUR_REMOTE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang lld \
            protobuf-compiler
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # Preserve the repository lint levels. The action defaults to
          # `-D warnings`, which breaks feature-specific dependency builds on
          # intentional dead-code warnings before this job reaches its tests.
          rustflags: ""
      - name: Cache ~/.cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          workspaces: crates/spur-context-service -> target
          shared-key: context-service
      - name: Test Code Lambda feature closure
        run: scripts/spur-cargo --workdir crates/spur-context-service test --no-default-features --features code-lambda --lib
      - name: Test Knowledge Lambda feature closure
        run: scripts/spur-cargo --workdir crates/spur-context-service test --no-default-features --features knowledge-lambda

  script-guards:
    name: deploy + workflow guardrails
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Check deploy/workflow invariants
        run: python -m pytest tests/scripts/test_spur_context_service_deploy.py -q
      - name: Check Graviton2 baseline guard
        run: bash infra/spur-context-service/test-graviton2-baseline.sh

  build-aws-artifacts:
    name: build staging worker images + Lambda zip
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_aws_artifacts }}
    environment: context-service-staging
    permissions:
      contents: read
      id-token: write
    env:
      SPUR_CONTEXT_SERVICE_BUILD_MODE: "self-contained"
      SPUR_CONTEXT_SERVICE_PUSH_IMAGES: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip gzip curl
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CONTEXT_SERVICE_AWS_ROLE_ARN }}
          allowed-account-ids: "591950085580"
          aws-region: ${{ env.AWS_REGION }}
      - name: Build worker image artifacts
        run: infra/spur-context-service/build-and-push-remote.sh --no-push
      - name: Build serving Lambda artifact
        run: infra/spur-context-service/deploy.sh --skip-worker --package-only --build-mode self-contained
      - name: Upload worker image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spur-context-service-worker-images
          path: target/lambda/*worker*image.tar
          if-no-files-found: error
      - name: Upload serving Lambda zips
        uses: actions/upload-artifact@v4
        with:
          name: spur-context-service-lambda-zips
          path: target/lambda/spur-context-*-lambda.zip
          if-no-files-found: error

  staging-smoke:
    name: staging medallion smoke
    runs-on: ubuntu-24.04
    needs:
      - crate-serving-features
      - script-guards
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_staging_smoke }}
    environment: context-service-staging
    permissions:
      contents: read
      id-token: write
    env:
      SPUR_CONTEXT_SMOKE_CODE_LAMBDA: ${{ vars.CONTEXT_SERVICE_STAGING_CODE_LAMBDA || 'spur-context-code' }}
      SPUR_CONTEXT_SMOKE_KNOWLEDGE_LAMBDA: ${{ vars.CONTEXT_SERVICE_STAGING_KNOWLEDGE_LAMBDA || 'spur-context-knowledge' }}
      SPUR_CONTEXT_SMOKE_SOURCE_BUCKET: ${{ vars.CONTEXT_SERVICE_STAGING_SOURCE_BUCKET }}
      SPUR_CONTEXT_SMOKE_DATA_BUCKET: ${{ vars.CONTEXT_SERVICE_STAGING_DATA_BUCKET }}
      SPUR_CONTEXT_SMOKE_S3_PREFIX: ci/context-service-smoke/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CONTEXT_SERVICE_AWS_ROLE_ARN }}
          allowed-account-ids: "591950085580"
          aws-region: ${{ env.AWS_REGION }}
      - name: Run staging E2E smoke
        run: python3 infra/spur-context-service/smoke-staging-e2e.py

  # Auto-release channel (modeled on release-dist.yml): every main push that
  # touches the service (see the workflow paths filter) ships the serving-plane
  # code after the test and guardrail jobs pass.
  #
  # Builds run on the shared AWS Spot builder pool, not the runner: deploy.sh's
  # default remote mode dispatches the Graviton2-safe compiles through
  # scripts/spur-cargo and fetches the serving binaries back for zip packaging.
  # No QEMU, runner-side docker, worker build, or ECR mutation is involved.
  #
  # Scope is deliberately code-only — no terraform runs from CI:
  #   - serving Lambda: API Gateway invokes the unqualified function ($LATEST),
  #     so `aws lambda update-function-code` IS the rollout;
  #   - worker and Knowledge artifacts: stay pinned until an operator promotes
  #     them together through the Terraform deploy path, avoiding
  #     Lambda/Fargate/serving skew mid-ingest.
  #
  # Required configuration:
  #   vars.AWS_RELEASE_ROLE_ARN — shared-builder role from release-dist.yml,
  #       covering EC2/SSM and the sccache artifact hop used for packaging.
  #   vars.CONTEXT_SERVICE_RELEASE_ROLE_ARN — staging deployment role covering
  #       the Code Lambda update, release zip S3 write, both serving Lambda
  #       configuration reads, and non-ingesting preflight access. Keeping it
  #       separate avoids granting the deployment role shared-builder control.
  #       Both roles' MaxSessionDuration must cover role-duration-seconds.
  #   vars.SPUR_BUILDER_AMI_ID — optional golden AMI for fast VM boots.
  release-staging:
    name: release serving Lambda to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - crate-serving-features
      - script-guards
    environment: context-service-staging
    permissions:
      contents: read
      id-token: write
    # One release at a time across runs; a second main push queues.
    concurrency:
      group: context-service-release
      cancel-in-progress: false
    env:
      SPUR_CONTEXT_SERVICE_BUILD_MODE: "remote"
      # This is a Code-only serving rollout. Worker and Knowledge artifacts
      # remain pinned, so the release role does not need ECR mutation access.
      SPUR_CONTEXT_SERVICE_PUSH_IMAGES: "0"
      # cloud-build pins (release-dist.yml): Malaysia Graviton4 Spot only, one
      # 16-vCPU leg. Never fall back to compiling on the runner — that would
      # emit wrong-arch artifacts. Fail fast instead.
      SPUR_CLOUD: aws-my
      SPUR_CLOUD_FALLBACK: ""
      AWS_INSTANCE_TYPE: m8gd.4xlarge
      AWS_INSTANCE_TYPE_FALLBACK: m8gd.2xlarge
      SPUR_BUILD_JOBS: "16"
      SPUR_NO_LOCAL_FALLBACK: "1"
      # Reuse the provider-approved shared pool contract from release-dist.yml.
      # The queue selects overflow builders when needed, and each builder's
      # VM-side idle service stops it after the release becomes inactive.
      VM_NAME: spur-builder
      SPUR_BUILD_POOL_NAME: spur-builder
      SPUR_BUILD_MAX_BUILDERS: "3"
      SPUR_BUILD_SLOTS_PER_VM: "3"
      AWS_AMI_ID: ${{ vars.SPUR_BUILDER_AMI_ID }}
      SPUR_CONTEXT_SMOKE_CODE_LAMBDA: ${{ vars.CONTEXT_SERVICE_STAGING_CODE_LAMBDA || 'spur-context-code' }}
      SPUR_CONTEXT_SMOKE_KNOWLEDGE_LAMBDA: ${{ vars.CONTEXT_SERVICE_STAGING_KNOWLEDGE_LAMBDA || 'spur-context-knowledge' }}
      SPUR_CONTEXT_SMOKE_SOURCE_BUCKET: ${{ vars.CONTEXT_SERVICE_STAGING_SOURCE_BUCKET }}
      SPUR_CONTEXT_SMOKE_DATA_BUCKET: ${{ vars.CONTEXT_SERVICE_STAGING_DATA_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip gzip curl
      - name: Configure AWS builder credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          allowed-account-ids: "591950085580"
          aws-region: ${{ env.AWS_REGION }}
          # A cold-cache remote build can outlive the default 1 h credentials.
          role-duration-seconds: 7200
      - name: Restore cloud-build scripts (S3 bundle)
        # scripts/cloud-build is a symlink into the private sibling
        # spur-notebook checkout; restore the published bundle so the tracked
        # symlink resolves exactly like on a workstation.
        run: |
          aws s3 cp "s3://${{ vars.AWS_SCCACHE_BUCKET }}/ci/cloud-build/bundle.tar.gz" \
            /tmp/cloud-build-bundle.tar.gz --region ap-southeast-5
          mkdir -p "$GITHUB_WORKSPACE/../spur-notebook/scripts"
          tar -xzf /tmp/cloud-build-bundle.tar.gz -C "$GITHUB_WORKSPACE/../spur-notebook/scripts"
          test -x "$GITHUB_WORKSPACE/scripts/cloud-build/spin.sh"
      - name: Install session-manager-plugin
        run: |
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Generate ephemeral SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/spur-ctx-release"
          echo "AWS_SSH_KEY=$HOME/.ssh/spur-ctx-release" >> "$GITHUB_ENV"
      - name: Resume shared build pool
        # Fail fast on Spot capacity / IAM problems before paying for the build.
        run: scripts/cloud-build/spin.sh
      - name: Package serving Lambda artifacts
        run: infra/spur-context-service/deploy.sh --skip-worker --package-only
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CONTEXT_SERVICE_RELEASE_ROLE_ARN }}
          allowed-account-ids: "591950085580"
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Release Code Lambda
        # The zip exceeds UpdateFunctionCode's ~70 MB inline payload limit, so
        # stage it in S3 first, reusing the content-addressed key shape of the
        # Terraform Code Lambda deploy path (aws_s3_object.code_lambda_zip).
        run: |
          zip_path=target/lambda/spur-context-code-lambda.zip
          zip_md5=$(md5sum "$zip_path" | cut -d' ' -f1)
          s3_key="lambda/spur-context-code-${zip_md5}.zip"
          aws s3 cp "$zip_path" "s3://$SPUR_CONTEXT_SMOKE_DATA_BUCKET/$s3_key"
          aws lambda update-function-code \
            --function-name "$SPUR_CONTEXT_SMOKE_CODE_LAMBDA" \
            --s3-bucket "$SPUR_CONTEXT_SMOKE_DATA_BUCKET" \
            --s3-key "$s3_key" \
            --publish > /tmp/update-function-code.json
          aws lambda wait function-updated-v2 \
            --function-name "$SPUR_CONTEXT_SMOKE_CODE_LAMBDA"
          python3 -c 'import json; r = json.load(open("/tmp/update-function-code.json")); print("released", r["FunctionName"], "version", r["Version"], "sha256", r["CodeSha256"])'
      - name: Upload released Code Lambda zip
        uses: actions/upload-artifact@v4
        with:
          name: spur-context-code-release-zip
          path: target/lambda/spur-context-code-lambda.zip
          if-no-files-found: error
      - name: Verify serving plane (non-ingesting preflight)
        run: python3 infra/spur-context-service/smoke-staging-e2e.py --preflight
