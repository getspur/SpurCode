name: CI

# Workspace compile and test gate. GitHub OIDC grants access to the same AWS
# Malaysia S3 cache used by the remote builders. Pull requests use local cache only.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't queue duplicates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Matches the remote build VM (scripts/cloud-build/startup-aws.sh): incremental
  # artifacts are not worth their cost in ephemeral/cached CI.
  CARGO_INCREMENTAL: "0"

jobs:
  check-test:
    name: check + unit test (workspace)
    runs-on: ubuntu-24.04
    # id-token: write is REQUIRED for the GitHub OIDC token exchanged
    # for AWS credentials. contents: read is the default, restated explicitly.
    permissions:
      contents: read
      id-token: write
    env:
      # sccache -> shared S3 bucket via GitHub OIDC.
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.AWS_SCCACHE_BUCKET }}
      SCCACHE_REGION: ap-southeast-5
      SCCACHE_S3_KEY_PREFIX: spur
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_MULTILEVEL_CHAIN: disk,s3
      AWS_EC2_METADATA_DISABLED: "true"
      # Route build-script C/C++/asm compiles (libduckdb-sys, aws-lc-sys,
      # zstd-sys, ...) through sccache too. cc-rs honors CC/CXX; cmake-based
      # crates (aws-lc-sys) honor the *_COMPILER_LAUNCHER vars. This mirrors the
      # VM wrappers in scripts/cloud-build/startup-aws.sh.
      CC: "sccache cc"
      CXX: "sccache c++"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_ASM_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4

      # System libraries the workspace links against — mirrored from the remote
      # build VM provisioning (scripts/cloud-build/startup-aws.sh). Tauri/wry pull the
      # GTK/WebKit stack; protobuf-compiler provides protoc (PROTOC_INCLUDE is
      # set relative-to-repo in .cargo/config.toml). libduckdb-sys builds the
      # vendored DuckDB amalgamation from source, so clang/cmake are required.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang lld \
            protobuf-compiler \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      # Reads rust-toolchain.toml (channel + rustfmt/clippy components) so CI,
      # local dev, and the remote VM all use the identical pinned toolchain.
      # cache: false — sccache owns the compile cache; rust-cache below caches
      # only ~/.cargo so the two don't both consume the ~10GB GHA cache budget.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache ~/.cargo (registry + git, not target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Authenticate to AWS (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_SCCACHE_ROLE_ARN }}
          aws-region: ap-southeast-5
          allowed-account-ids: "591950085580"
      - name: Use local cache for pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_CHAIN=disk" >> "$GITHUB_ENV"
      # Pinned to the VM's exact sccache version (scripts/cloud-build/startup-aws.sh)
      # so cache keys match and CI hits objects the VM already populated.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.15.0"

      # --locked: fail if Cargo.lock would change. Keeps CI reproducible and
      # catches an un-committed lockfile drift. Verified locally that the
      # current lockfile satisfies --locked (cargo metadata --locked).
      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets --locked

      # nextest: process-per-test isolation + parallelism + flaky-retry/JUnit
      # (see .config/nextest.toml). Scoped to --lib here, matching the
      # conservative first gate; integration tests (tests/) that need external
      # infra are a follow-up lane.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo nextest (workspace, lib unit tests)
        run: cargo nextest run --workspace --lib --profile ci --locked

      # Doctests: nextest cannot run them, so run them separately to keep the
      # ~34 doc code-fences in the suite covered.
      - name: doctests
        run: cargo test --workspace --doc --locked

      # Continuous dependency-topology hygiene gate (2026-09-23 spur-utilities
      # decoupling spec, §5): default-features spur-mentions must contain
      # neither spur-acp nor ratatui; --features code must contain neither
      # ratatui nor spur-tui (spur-acp IS expected there, via
      # spur-graph -> spur-mcp); spur-utilities must depend directly on
      # exactly spur-commands + spur-mentions. `cargo xtask hygiene` skips
      # crates that are not scaffolded yet, so this step stays green at every
      # migration phase.
      - name: cargo xtask hygiene (dependency topology)
        run: cargo xtask hygiene

      # The notebook consumes spur-mentions with default-features = false;
      # --workspace builds never compile that configuration (feature
      # unification turns `code` on), so it gets dedicated clippy + test
      # gates (spec §5). Raw cargo on purpose: they turn on once the crate
      # is scaffolded and stay unconditional from then on.
      - name: cargo clippy -p spur-mentions --no-default-features
        run: cargo clippy -p spur-mentions --no-default-features --locked -- -D warnings
      - name: cargo test -p spur-mentions --no-default-features
        run: cargo test -p spur-mentions --no-default-features --locked

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      # Visibility: cache hit-rates (rust + C/C++ + assembler) per run. Watch
      # these to confirm the cache is warming across runs and to tune later.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Formatting gate. Cheap (rustfmt doesn't compile/link, so no system deps) and
  # blocking — verified locally that `cargo fmt --all --check` is currently clean
  # on the pinned stable toolchain. Note: rustfmt.toml enables several nightly-only
  # options (wrap_comments, group_imports, ...) that stable silently ignores; this
  # gate therefore enforces the stable-applicable subset, consistently with what
  # developers get from the pinned toolchain locally.
  fmt:
    name: rustfmt --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo fmt --all --check

  # Clippy lint gate — NON-BLOCKING for now (continue-on-error), on purpose.
  #
  # The workspace clippy policy ([workspace.lints.clippy] in Cargo.toml) is
  # already active on 18/19 crates via `[lints] workspace = true`; only
  # spur-graph does not opt in. So this is mostly about enforcing that policy
  # (plus clippy defaults) as a hard `-D warnings` gate for the first time.
  # It is left non-blocking initially because remote-cargo is enabled
  # (.spur/remote-cargo.enabled), so the warning baseline could not be measured
  # locally without spinning the AWS build VM. This job's first runs ARE that
  # measurement. Upgrade path once triaged:
  #   - add `[lints] workspace = true` to spur-graph (the lone gap), then
  #   - drop continue-on-error and append `-- -D warnings`.
  clippy:
    name: clippy (non-blocking baseline)
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.AWS_SCCACHE_BUCKET }}
      SCCACHE_REGION: ap-southeast-5
      SCCACHE_S3_KEY_PREFIX: spur
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_MULTILEVEL_CHAIN: disk,s3
      AWS_EC2_METADATA_DISABLED: "true"
      CC: "sccache cc"
      CXX: "sccache c++"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_ASM_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake clang lld \
            protobuf-compiler \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache ~/.cargo (registry + git, not target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          # Distinct key so clippy's registry cache doesn't evict check-test's.
          shared-key: clippy
      - name: Authenticate to AWS (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_SCCACHE_ROLE_ARN }}
          aws-region: ap-southeast-5
          allowed-account-ids: "591950085580"
      - name: Use local cache for pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_CHAIN=disk" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.15.0"
      - run: cargo clippy --workspace --all-targets --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats
