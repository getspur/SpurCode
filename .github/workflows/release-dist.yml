# Release channel that drives `cargo xtask dist` on the shared AWS Spot builder
# pool (scripts/cloud-build), instead of compiling on GitHub-hosted runners
# like release.yml (cargo-dist) does.
#
# Flow: OIDC → AWS credentials → resume the shared Spot pool
# (`spur-builder` through `spur-builder-3`) → `cargo xtask dist` (linux aarch64 native,
# linux x86_64 + per-architecture macOS via zigbuild, windows x86_64 via xwin — all
# compiled ON the VM and fetched back through the sccache S3 bucket; embeds
# crates/spur-cli/assets/skills in every binary and also packages the tree as
# spur-skills-<ver>.tar.gz for npm/filesystem compatibility)
# → upload dist/ as a workflow artifact (optionally publish a GitHub release on
# getspur/spur-releases) → VM-side idle shutdown after 15 minutes.
#
# VM lifecycle guarantees:
#   1. only canonical spur-builder pool identities can be started or created;
#   2. the VM stops after 15 idle minutes, preserving its root EBS toolchain;
#   3. persistent Spot replacement identity is recovered through request tags.
#
# Required repository configuration (full details, incl. the IAM policy shape:
# docs/superpowers/specs/2026-07-07-release-dist-spot-vm-cd.md):
#   vars.AWS_RELEASE_ROLE_ARN — OIDC-assumable role: EC2 describe/run/stop/start,
#       iam:PassRole on spur-builder, SSM StartSession/SendCommand, S3 RW on the
#       sccache bucket. MaxSessionDuration must cover role-duration-seconds below.
#   vars.SPUR_BUILDER_AMI_ID  — optional golden AMI (bake-ami.sh) for ~1-2 min
#       boots; empty falls back to the base Debian 12 arm64 AMI + full startup
#       provisioning (8-12 min, can brush the 15-min startup-wait ceiling).
#   secrets.GH_RELEASES_TOKEN — only for publish=true; write access to
#       getspur/spur-releases (same secret release.yml uses).
#   npm trusted publisher     — @getspur/spur-cli publishes via OIDC from this
#       workflow filename (release-dist.yml) on the GitHub-hosted runner after
#       the GitHub release exists. Configure the publisher on npmjs.com
#       (https://docs.npmjs.com/trusted-publishers); no long-lived NPM_TOKEN.
#   S3 cloud-build bundle    — scripts/cloud-build is a git-tracked symlink
#       into the sibling spur-notebook checkout, so the runner restores the
#       scripts from s3://<sccache-bucket>/ci/cloud-build/bundle.tar.gz.
#       Refresh with scripts/cloud-build-publish-bundle.sh whenever the
#       cloud-build scripts change.

name: Release Dist (spot VM)

on:
  # Tag pushes are the release trigger since the 2026-07-07 cutover from the
  # cargo-dist release.yml (which keeps only its pull_request plan check).
  # A tag push implies publish=true with the tag as the release name.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: linux,linux-x64,macos-arm64,macos-x64,windows)"
        type: string
        default: "linux,linux-x64,macos-arm64,macos-x64,windows"
      publish:
        description: "Publish a GitHub release on getspur/spur-releases"
        type: boolean
        default: false
      tag:
        description: "Release tag when publishing (default: v<workspace version>)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # OIDC exchange for AWS credentials

# One release-VM flow at a time: a second dispatch queues instead of racing
# the S3 fetch prefix and the GitHub release.
concurrency:
  group: release-dist
  cancel-in-progress: false

env:
  # cloud-build pins: Malaysia Graviton4 Spot only. The same-region r8gd->m8gd
  # instance-type fallback stays inside the provider; the cross-region Tokyo
  # fallback is disabled because its sccache L2 is cold and the OIDC role is
  # provisioned for ap-southeast-5.
  SPUR_CLOUD: aws-my
  SPUR_CLOUD_FALLBACK: ""
  # Match the canonical 8-vCPU / 64 GB Graviton4 pool shape. Three parallel
  # legs may share one builder; each leg keeps cargo -j8 as the pool contract.
  AWS_INSTANCE_TYPE: r8gd.2xlarge
  AWS_INSTANCE_TYPE_FALLBACK: m8gd.2xlarge
  SPUR_BUILD_JOBS: "8"
  # Never compile release artifacts on the runner: local fallback would emit
  # wrong-arch binaries (or burn 40 min before fetch.sh fails). Fail fast.
  SPUR_NO_LOCAL_FALLBACK: "1"
  # Reuse the exact same identity and queue geometry as developer builds.
  # build.sh records each namespace's selected pool member so fetch.sh reads
  # the artifact from the VM that actually compiled it.
  VM_NAME: spur-builder
  SPUR_BUILD_POOL_NAME: spur-builder
  SPUR_BUILD_MAX_BUILDERS: "3"
  SPUR_BUILD_SLOTS_PER_VM: "3"
  # Optional golden AMI baked by scripts/cloud-build/bake-ami.sh. Empty
  # resolves the latest base Debian 12 arm64 AMI at spin time.
  AWS_AMI_ID: ${{ vars.SPUR_BUILDER_AMI_ID }}

jobs:
  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          allowed-account-ids: "591950085580"
          aws-region: ap-southeast-5
          # The whole job talks to AWS (SSM tunnel for ssh/rsync + S3 artifact
          # fetch); the default 1 h credentials would expire mid-build. The
          # role's MaxSessionDuration must be >= this value.
          role-duration-seconds: 10800

      - name: Restore cloud-build scripts (S3 bundle)
        # scripts/cloud-build is a symlink to ../../spur-notebook/scripts/
        # cloud-build — a private sibling repo that is not checked out here.
        # Restore the published bundle to that sibling path so the tracked
        # symlink resolves exactly like on a workstation (spin/shutdown, the
        # spur-cargo dispatch, and xtask's fetch.sh all go through it).
        run: |
          aws s3 cp "s3://${{ vars.AWS_SCCACHE_BUCKET }}/ci/cloud-build/bundle.tar.gz" \
            /tmp/cloud-build-bundle.tar.gz --region ap-southeast-5
          mkdir -p "$GITHUB_WORKSPACE/../spur-notebook/scripts"
          tar -xzf /tmp/cloud-build-bundle.tar.gz -C "$GITHUB_WORKSPACE/../spur-notebook/scripts"
          test -x "$GITHUB_WORKSPACE/scripts/cloud-build/spin.sh"
          echo "cloud-build scripts restored ($(ls "$GITHUB_WORKSPACE/../spur-notebook/scripts/cloud-build" | wc -l) files)"

      - name: Install session-manager-plugin
        # SSH-over-SSM transport (scripts/cloud-build/_aws-ssm-ssh.sh) tunnels
        # every remote command through `aws ssm start-session`.
        run: |
          curl -fsSL -o /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - name: Generate ephemeral SSH key
        # cloud-build installs the public half through SSM when a stopped shared
        # builder resumes; the private half is discarded with the runner.
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/spur-release"
          echo "AWS_SSH_KEY=$HOME/.ssh/spur-release" >> "$GITHUB_ENV"

      - name: Resume shared build pool
        # Fail fast on Spot capacity / IAM problems before paying for the
        # xtask compile. (build.sh --auto-spin would also create the VM, but
        # only after xtask has already started.)
        run: scripts/cloud-build/spin.sh

      - name: Build platform matrix (cargo xtask dist)
        env:
          # Empty on tag pushes (inputs only exist for workflow_dispatch).
          PLATFORMS: ${{ inputs.platforms || 'linux,linux-x64,macos-arm64,macos-x64,windows' }}
        # --parallel runs the legs concurrently in per-platform remote
        # namespaces; the VM is already up from the spin step, so the
        # concurrent --auto-spin dispatches cannot race a create.
        run: cargo xtask dist --parallel --platforms "$PLATFORMS"

      - name: Smoke-test linux x86_64 embedded skills + compatibility bundle
        # The runner itself is linux x86_64 — the one dist platform we can
        # actually execute here. The zigbuild cross leg is the least battle-
        # tested, so refuse to publish a binary that cannot even --version.
        # Run `spur skills init` before extracting any adjacent assets to prove
        # the binary is self-contained. Then require spur-skills-*.tar.gz and
        # verify the compatibility share/spur/skills layout resolves too.
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(dist/spur-*-x86_64-unknown-linux-gnu)
          skills=(dist/spur-skills-*.tar.gz)
          duckdb_exts=(dist/spur-duckdb-extensions-*.tar.gz)
          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "no linux-x64 artifact in dist/; skipping binary smoke test"
          else
            chmod +x "${bins[0]}"
            "${bins[0]}" --version
          fi
          if [[ ${#skills[@]} -eq 0 ]]; then
            echo "missing dist/spur-skills-*.tar.gz — xtask dist must package crates/spur-cli/assets/skills" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          if [[ ${#duckdb_exts[@]} -eq 0 ]]; then
            echo "missing dist/spur-duckdb-extensions-*.tar.gz — xtask dist must tar the DuckDB sidecar (GitHub cannot upload directories)" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          if [[ -d dist/duckdb-extensions ]]; then
            echo "dist/duckdb-extensions is a directory; gh release create dist/* cannot upload it" >&2
            exit 1
          fi
          # Layout contract: archive root is share/spur/skills (matches
          # package_asset_candidates + cargo xtask install).
          skill_entries="$(tar -tzf "${skills[0]}")"
          if ! grep -Eq 'share/spur/skills/.*/SKILL\.md' <<<"$skill_entries"; then
            echo "skills archive missing share/spur/skills/*/SKILL.md" >&2
            sed -n '1,10p' <<<"$skill_entries" >&2
            exit 1
          fi
          duckdb_entries="$(tar -tzf "${duckdb_exts[0]}")"
          if ! grep -Eq 'share/spur/duckdb-extensions/v[^/]+/[^/]+/[^/]+\.duckdb_extension' <<<"$duckdb_entries"; then
            echo "duckdb archive missing share/spur/duckdb-extensions/v*/<platform>/*.duckdb_extension" >&2
            sed -n '1,10p' <<<"$duckdb_entries" >&2
            exit 1
          fi
          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "skills archive present; binary smoke skipped (no linux-x64)"
            exit 0
          fi
          smoke="$(mktemp -d)"
          mkdir -p "$smoke/prefix/bin" "$smoke/embedded-home" \
            "$smoke/embedded-repo" "$smoke/home" "$smoke/repo"
          cp "${bins[0]}" "$smoke/prefix/bin/spur"
          chmod +x "$smoke/prefix/bin/spur"
          (
            cd "$smoke/embedded-repo"
            HOME="$smoke/embedded-home" XDG_CONFIG_HOME="$smoke/embedded-home/xdg" \
              "$smoke/prefix/bin/spur" skills init
          )
          embedded=( "$smoke/embedded-home"/.spur/cache/embedded-skills/*/skills/spur-way/SKILL.md )
          if [[ ${#embedded[@]} -ne 1 ]]; then
            echo "binary-only skills init did not materialize embedded spur-way" >&2
            find "$smoke/embedded-home" -maxdepth 8 -type f >&2 || true
            exit 1
          fi

          tar -xzf "${skills[0]}" -C "$smoke/prefix"
          test -f "$smoke/prefix/share/spur/skills/spur-way/SKILL.md"
          # Isolated HOME avoids host config breaking catalog discovery.
          (
            cd "$smoke/repo"
            HOME="$smoke/home" XDG_CONFIG_HOME="$smoke/home/xdg" \
              "$smoke/prefix/bin/spur" skills init
          )
          # At least one adapter dir should materialize after a full init.
          found=0
          for d in "$smoke/repo"/.claude/skills "$smoke/repo"/.codex/skills \
                   "$smoke/repo"/.spur/skills; do
            if [[ -d "$d" ]] && [[ -n "$(ls -A "$d" 2>/dev/null || true)" ]]; then
              found=1
              break
            fi
          done
          if [[ "$found" -ne 1 ]]; then
            echo "skills init produced no adapter skill dirs under $smoke/repo" >&2
            find "$smoke/repo" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          echo "skills smoke ok: ${skills[0]} + ${bins[0]}"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: spur-dist
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        # Tag pushes always publish; manual dispatches opt in via the input.
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          PLATFORMS: ${{ inputs.platforms || 'linux,linux-x64,macos-arm64,macos-x64,windows' }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)".*/\1/p;}' Cargo.toml | head -n1)"
            [[ -n "$version" ]] || { echo "could not resolve workspace version" >&2; exit 1; }
            tag="v${version}"
          fi
          # GitHub release assets must be files. `dist/*` would also match
          # leftover directories (the previous duckdb-extensions/ sidecar).
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no files in dist/ to publish" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          if gh release view "$tag" --repo getspur/spur-releases >/dev/null 2>&1; then
            gh release upload "$tag" --repo getspur/spur-releases --clobber "${assets[@]}"
          else
            gh release create "$tag" --repo getspur/spur-releases \
              --title "$tag" --notes "spur $tag (xtask dist: $PLATFORMS)" \
              "${assets[@]}"
          fi

      - uses: actions/setup-node@v6
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish npm package (@getspur/spur-cli)
        # The npm wrapper (npm/spur-cli) downloads this release's binaries at
        # postinstall, so it must publish AFTER the GitHub release exists.
        # Continues the package lineage the cargo-dist flow published through
        # 1.6.0 (npm install -g @getspur/spur-cli / npx @getspur/spur-cli).
        # Auth is npm trusted publishing (OIDC): id-token: write + Node 24.
        # Do not set NODE_AUTH_TOKEN / secrets.NPM_TOKEN on this step.
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)".*/\1/p;}' Cargo.toml | head -n1)"
            tag="v${version}"
          fi
          version="${tag#v}"
          cd npm/spur-cli
          npm version "$version" --no-git-tag-version
          npm publish --access public

      # Do not stop the shared pool here: another workstation may still be
      # compiling. The VM-side autoshutdown service stops each idle builder
      # after 15 minutes without deleting its persistent Spot request or EBS.
